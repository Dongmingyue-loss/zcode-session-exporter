name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff
      - name: Unit and API tests
        run: python -m unittest discover -s test -v
      - name: Syntax and undefined names
        run: ruff check --select E9,F .

  ui:
    name: ui-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Generate demo database
        run: python scripts/make_demo_db.py
      - name: Python probe
        shell: bash
        run: |
          echo "--- version ---"
          python -u app.py --version
          echo "--- import ---"
          python -u -c "import app; print('imported', flush=True)"
          echo "--- socket/http probe ---"
          python -u -c "from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler; s=ThreadingHTTPServer(('127.0.0.1',0), BaseHTTPRequestHandler); print('bound', s.server_port, flush=True); s.server_close()"
          echo "--- direct app ---"
          python -u app.py --demo --no-open --token testtoken --port 0 --output-dir /tmp/zcode-probe2 &
          PID=$!
          sleep 5
          kill "$PID" || true
      - name: Startup probe
        shell: bash
        run: |
          python -u app.py --demo --no-open --token testtoken --port 0 --output-dir /tmp/zcode-probe > /tmp/zcode-probe.log 2>&1 &
          PID=$!
          sleep 5
          echo "--- probe log ---"
          cat /tmp/zcode-probe.log
          echo "--- process state ---"
          ps -p "$PID" || true
          kill "$PID" || true
      - name: Headless browser smoke test
        run: python test/ui_smoke.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
